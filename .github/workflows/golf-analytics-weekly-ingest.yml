name: Golf analytics weekly ingest

on:
  workflow_dispatch:
    inputs:
      season:
        description: Optional ESPN PGA calendar season; defaults to the current UTC year.
        required: false
        type: string
  schedule:
    # Sunday 05:17 UTC: weekly, quiet, and intentionally off the top of the hour.
    - cron: '17 5 * * 0'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOLF_ANALYTICS_INGEST_BASE_URL: https://www.111sports.app
      GOLF_ANALYTICS_INGEST_SECRET: ${{ secrets.GOLF_ANALYTICS_INGEST_SECRET }}
      GOLF_ANALYTICS_SEASON: ${{ inputs.season }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # TypeScript is the only runtime dependency needed to execute the shared pure normalizer.
      - name: Install shared normalizer dependency
        run: npm ci --ignore-scripts --omit=optional
      - name: Fetch ESPN and ingest bounded Golf analytics batches
        run: node scripts/run-golf-analytics-ingest.cjs
