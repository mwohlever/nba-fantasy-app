name: Refresh live golf

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      slate_id:
        description: "Optional slate ID"
        required: false
        type: string

concurrency:
  group: refresh-live-golf
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch ESPN and ingest Golf scores
        env:
          APP_URL: ${{ secrets.APP_URL }}
          GOLF_CRON_SECRET: ${{ secrets.GOLF_CRON_SECRET }}
          REQUESTED_SLATE_ID: ${{ inputs.slate_id }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL repository secret is missing."
            exit 1
          fi

          if [ -z "${GOLF_CRON_SECRET:-}" ]; then
            echo "GOLF_CRON_SECRET repository secret is missing."
            exit 1
          fi

          BASE_URL="${APP_URL%/}"

          echo "Loading active Golf slate manifest..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 60 \
            -H "Authorization: Bearer ${GOLF_CRON_SECRET}" \
            "${BASE_URL}/api/cron/golf-refresh-manifest" \
            > manifest.json

          jq . manifest.json

          SLATE_COUNT="$(
            jq '.slates | length' \
              manifest.json
          )"

          echo "Active slates found: ${SLATE_COUNT}"

          if [ "${SLATE_COUNT}" -eq 0 ]; then
            echo "No active Golf slates."
            exit 0
          fi

          jq -c '.slates[]' \
            manifest.json \
            | while read -r SLATE
          do
            SLATE_ID="$(
              jq -r '.slateId' \
                <<<"${SLATE}"
            )"

            EVENT_ID="$(
              jq -r '.eventId' \
                <<<"${SLATE}"
            )"

            YEAR="$(
              jq -r '.year' \
                <<<"${SLATE}"
            )"

            TOURNAMENT="$(
              jq -r '.tournament' \
                <<<"${SLATE}"
            )"

            if \
              [ -n "${REQUESTED_SLATE_ID:-}" ] && \
              [ "${SLATE_ID}" != "${REQUESTED_SLATE_ID}" ]
            then
              continue
            fi

            echo
            echo "========================================"
            echo "Refreshing ${TOURNAMENT}"
            echo "Slate: ${SLATE_ID}"
            echo "Event: ${EVENT_ID}"
            echo "Year: ${YEAR}"
            echo "========================================"

            ESPN_URL="https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard?dates=${YEAR}&event=${EVENT_ID}"

            echo "Fetching event-specific ESPN scoreboard..."

            ESPN_STATUS="$(
              curl \
                --silent \
                --show-error \
                --retry 3 \
                --retry-delay 5 \
                --max-time 90 \
                --output scoreboard.json \
                --write-out "%{http_code}" \
                -H "Accept: application/json, text/plain, */*" \
                -H "Origin: https://www.espn.com" \
                -H "Referer: https://www.espn.com/golf/leaderboard" \
                -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
                "${ESPN_URL}"
            )"

            echo "ESPN HTTP status: ${ESPN_STATUS}"

            if [ "${ESPN_STATUS}" -lt 200 ] || [ "${ESPN_STATUS}" -ge 300 ]; then
              echo "ESPN request failed. Response body:"
              cat scoreboard.json
              exit 1
            fi

            if ! jq -e '.events | type == "array"' scoreboard.json >/dev/null; then
              echo "ESPN returned an unexpected payload:"
              head -c 3000 scoreboard.json
              echo
              exit 1
            fi

            echo "ESPN events returned: $(jq '.events | length' scoreboard.json)"

            jq \
              --argjson slateId "${SLATE_ID}" \
              --slurpfile scoreboard scoreboard.json \
              '{
                slateId: $slateId,
                scoreboardPayload: $scoreboard[0]
              }' \
              /dev/null \
              > ingestion.json

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 2 \
              --retry-delay 5 \
              --max-time 180 \
              -X POST \
              -H "Authorization: Bearer ${GOLF_CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --data-binary @ingestion.json \
              "${BASE_URL}/api/refresh-stats-golf" \
              > result.json

            jq . result.json

            SUCCESS="$(
              jq -r '.success // false' \
                result.json
            )"

            if [ "${SUCCESS}" != "true" ]; then
              echo "Golf ingestion did not report success."
              exit 1
            fi
          done
