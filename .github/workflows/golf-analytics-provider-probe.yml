name: Golf analytics provider probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate ESPN PGA 2026 season
        run: node scripts/probe-golf-analytics-provider.mjs 2026
